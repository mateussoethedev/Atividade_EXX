<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar minha Conta - EXX Nutrition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
    <nav class="menu">
        <a href="#">CATEGORIAS ▾</a>
        <a href="#">MAIS VENDIDOS</a>
        <a href="#">A EMPRESA</a>
        <a href="#">CONTATO</a>
        <a href="#">BLOG</a>
    </nav>

    <div class="logo">
        <img src="../../logoEXX.jpg" alt="Logo EXX Nutrition" height="41">
    </div>


    <div class="icones">
        <a>👤</a>
        <a>🛒</a>
        <a>♡</a>
    </div>
</header>

<div class="funcoes">
    <a>Inicio </a>
    <a>/</a>
    <a>Minha Conta</a>
    <a>/</a>
    <a class="cadastre-se">Cadastre-se</a>
</div>

<div class="cadastro_cliente">
    <a>Compre mais rápido e acompanhe seus pedidos em um só lugar!</a>
    <br>
    <form class="form-cadastro">
        <div class="input-grupo">
            <label for="nome">NOME COMPLETO</label>
            <input type="text" id="nome" placeholder="ex.: Mateus Soethe Brand">
        </div>

        <div class="input-grupo">
            <label for="email">E-MAIL</label>
            <input type="email" id="email" placeholder="ex.: seunome@email.com.br">
        </div>

        <div class="input-grupo">
            <label for="cpf">CPF</label>
            <input type="cpf" id="cpf" placeholder="ex.: 12345678910">
        </div>

        <div class="input-grupo">
            <label for="telefone">TELEFONE</label>
            <input type="tel" id="telefone" placeholder="ex.: 12 945678910">
        </div>

        <div class="input-grupo">
            <label for="senha">CRIE UMA SENHA</label>
            <input type="password" id="senha" placeholder="Crie sua senha aqui">
        </div>

        <div class="input-grupo">
            <label for="cep">CEP</label>
            <input type="cep" id="cep" placeholder="ex.: 01501970">
        </div>

        <div class="input-grupo">
            <label for="logradouro">LOGRADOURO</label>
            <input type="logr" id="logradouro" placeholder="ex.: Avenida/Rua ">
        </div>

        <div class="input-grupo">
            <label for="numero">NUMERO</label>
            <input type="number" id="numero" placeholder="ex.: 2123">
        </div>

        <div class="input-grupo">
            <label for="complemento">COMPLEMENTO</label>
            <input type="complemento" id="complemento" placeholder="ex.: perto do posto">
        </div>

        <div class="input-grupo">
            <label for="bairro">BAIRRO</label>
            <input type="bairro" id="bairro" placeholder="ex.: liberdade ">
        </div>

        <div class="input-grupo">
            <label for="cidade">CIDADE</label>
            <input type="cidade" id="cidade" placeholder="ex.: São Paulo ">
        </div>

        <div class="input-grupo">
            <label for="estado">ESTADO</label>
            <input type="estado" id="estado" placeholder="ex.: São Paulo">
        </div>

        <script src="script.js"></script>
        <button type="submit">Terminar Cadastro</button>

    </form>

</div>
</body>
</html>
